name: Automated Hourly Crypto Dataset Update

on:
  schedule:
    # Her saat başı 5. dakikada otomatik çalışır (Örn: 01:05, 02:05 UTC)
    - cron: '5 * * * *'
  # GitHub arayüzünden manuel "Run workflow" butonuyla da tetiklenebilir
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: Python 3.11 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Gerekli Paketleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy yfinance

      - name: Canlı Veri Boru Hattını Çalıştır
        run: |
          python update_dataset.py

      - name: Değişiklikleri GitHub Reposuna Otomatik Commit & Push Et
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "CryptoAI-MLOps-Bot"
          git add crypto_macro_dataset.csv
          if git diff --staged --quiet; then
            echo "Veri setinde yeni bir değişiklik yok, commit atlanıyor."
          else
            git commit -m "Auto-update crypto dataset (Hourly MLOps Ingestion) [skip ci]"
            git push
            echo "Yeni veriler GitHub reposuna başarıyla yüklendi!"
          fi
